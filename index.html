<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud POS System</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-6">
        <header class="bg-white shadow-md rounded-lg p-4 mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Golden Star POS (Cloud Enabled)</h1>
            <span id="connection-status" class="px-3 py-1 text-sm bg-yellow-100 text-yellow-800 rounded-full">Connecting to Cloud...</span>
        </header>

        <!-- Main POS Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Products Section -->
            <div class="md:col-span-2 bg-white p-4 rounded-lg shadow-md">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">Products / Items</h2>
                <div id="product-list" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <!-- Sample Product Button -->
                    <button onclick="addToCart('Wooden Center Table', 4500)" class="p-4 border rounded-lg hover:bg-indigo-50 text-left transition">
                        <p class="font-medium text-gray-800">Wooden Center Table</p>
                        <p class="text-indigo-600 font-bold mt-1">₹4,500</p>
                    </button>
                    <button onclick="addToCart('Mango Wood Organizer', 1200)" class="p-4 border rounded-lg hover:bg-indigo-50 text-left transition">
                        <p class="font-medium text-gray-800">Mango Wood Organizer</p>
                        <p class="text-indigo-600 font-bold mt-1">₹1,200</p>
                    </button>
                </div>
            </div>

            <!-- Cart / Billing Section -->
            <div class="bg-white p-4 rounded-lg shadow-md flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold mb-4 text-gray-700">Current Sale</h2>
                    <ul id="cart-items" class="divide-y divide-gray-200 mb-4 max-h-60 overflow-y-auto">
                        <p class="text-gray-400 text-sm">Cart is empty</p>
                    </ul>
                </div>
                <div>
                    <div class="border-t pt-4 mb-4 flex justify-between text-lg font-bold">
                        <span>Total:</span>
                        <span id="cart-total">₹0</span>
                    </div>
                    <button onclick="checkout()" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition font-medium">Complete Sale & Sync to Cloud</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Scripts (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDlHR_MyuEIu9mIs-4_Mmk8NRUsLGQslw0",
            authDomain: "my-pos-app-54ef4.firebaseapp.com",
            projectId: "my-pos-app-54ef4",
            storageBucket: "my-pos-app-54ef4.firebasestorage.app",
            messagingSenderId: "974088050332",
            appId: "1:974088050332:web:69dfd694fb6024cf197f59",
            measurementId: "G-9GENNN74FE"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Update UI status
        document.getElementById("connection-status").innerText = "Cloud Connected";
        document.getElementById("connection-status").className = "px-3 py-1 text-sm bg-green-100 text-green-800 rounded-full";

        // Cart State Logic
        let cart = [];

        window.addToCart = function(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById("cart-items");
            const cartTotal = document.getElementById("cart-total");
            
            if (cart.length === 0) {
                cartList.innerHTML = '<p class="text-gray-400 text-sm">Cart is empty</p>';
                cartTotal.innerText = "₹0";
                return;
            }

            cartList.innerHTML = "";
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                cartList.innerHTML += `<li class="py-2 flex justify-between text-sm"><span>${item.name}</span><span>₹${item.price}</span></li>`;
            });
            cartTotal.innerText = `₹${total}`;
        }

        window.checkout = async function() {
            if (cart.length === 0) {
                alert("Cart is empty!");
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + item.price, 0);
            
            try {
                // Save order to Firestore database under 'sales' collection
                const docRef = await addDoc(collection(db, "sales"), {
                    items: cart,
                    total: totalAmount,
                    timestamp: new Date().toISOString()
                });
                
                alert("Sale completed and securely synced to Cloud! ID: " + docRef.id);
                cart = [];
                updateCartUI();
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("Failed to sync sale to cloud. Check connection.");
            }
        }
    </script>
</body>
</html>
