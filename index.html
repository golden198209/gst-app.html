<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Tax Invoice PDF</title>
    <!-- html2pdf Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f9; }
        .invoice-box { max-width: 800px; margin: auto; background: #fff; padding: 30px; border: 1px solid #ddd; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: left; font-size: 13px; }
        th { background: #eee; }
        .text-right { text-align: right; }
        .btn-container { max-width: 800px; margin: 15px auto; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-pdf { background: #17a2b8; }
        .btn-wa { background: #25d366; }
    </style>
</head>
<body>

<div class="btn-container">
    <button class="btn btn-pdf" onclick="downloadInvoicePDF()">📥 Download PDF</button>
    <button class="btn btn-wa" onclick="shareWhatsApp()">📱 Share on WhatsApp</button>
</div>

<!-- Invoice Area to Print/PDF -->
<div class="invoice-box" id="pdfContent">
    <div class="header">
        <div>
            <h2>Golden Star Furniture & Interior</h2>
            <p>Lal Chowk, Srinagar, J&K<br>Phone: 7006688390</p>
        </div>
        <div class="text-right">
            <h3>TAX INVOICE</h3>
            <p><strong>Invoice No:</strong> 001<br><strong>Date:</strong> 18-Sep-2026</p>
        </div>
    </div>

    <div>
        <p><strong>Bill To:</strong><br>PRINCIPAL KV HUMHAMA<br>Budgam, Jammu & Kashmir</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Item Description</th>
                <th>Qty</th>
                <th>Rate (₹)</th>
                <th>Amount (₹)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Steel Almirah Big Size</td>
                <td>1</td>
                <td>9,322.03</td>
                <td>9,322.03</td>
            </tr>
        </tbody>
    </table>

    <table style="margin-top: 20px; border: none;">
        <tr>
            <td style="border: none;" class="text-right"><strong>Grand Total: ₹9,322.03</strong></td>
        </tr>
    </table>
</div>

<script>
    function downloadInvoicePDF() {
        const element = document.getElementById('pdfContent');
        const opt = {
            margin:       10,
            filename:     'Invoice_001.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().from(element).set(opt).save();
    }

    function shareWhatsApp() {
        let msg = "Hello, here is your Tax Invoice from Golden Star Furniture. Total Amount: ₹9,322.03. Thank you!";
        let url = `https://api.whatsapp.com/send?text=` + encodeURIComponent(msg);
        window.open(url, '_blank');
    }
</script>

</body>
</html>
