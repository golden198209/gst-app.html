<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Golden Star Furniture & Interior - Invoice</title>
    <style>
        /* ==========================================
           PURANA BASE CODE / LAYOUT (UNCHANGED)
           ================================---------- */
        body {
            font-family: Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 20px;
            background: #f4f4f4;
        }
        .invoice-box {
            max-width: 800px;
            margin: auto;
            padding: 30px;
            border: 1px solid #eee;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            background: #fff;
            border-radius: 8px;
        }
        .header-table, .items-table {
            width: 100%;
            border-collapse: collapse;
        }
        .items-table th, .items-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .text-right { text-align: right; }
        .controls-bar {
            max-width: 800px;
            margin: 0 auto 15px auto;
            background: #222;
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls-bar select, .controls-bar button {
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            border: none;
        }

        /* ==========================================
           NEW: 4 COLORFUL OPTIONS (ADD-ON STYLES)
           Purane code ke core logic ko chhede bina
           yeh 4 naye theme styles add kiye gaye hain
           ========================================== */
        
        /* 1. Emerald Professional */
        .theme-emerald h2 { color: #047857; }
        .theme-emerald .divider { height: 2px; background: #059669; margin: 15px 0; }
        .theme-emerald th { background-color: #ecfdf5 !important; color: #064e3b; border-bottom: 2px solid #059669; }

        /* 2. Royal Indigo */
        .theme-indigo h2 { color: #4338ca; }
        .theme-indigo .divider { height: 2px; background: #4f46e5; margin: 15px 0; }
        .theme-indigo th { background-color: #eef2ff !important; color: #312e81; border-bottom: 2px solid #4f46e5; }

        /* 3. Sunset Coral */
        .theme-coral h2 { color: #c2410c; }
        .theme-coral .divider { height: 2px; background: #ea580c; margin: 15px 0; }
        .theme-coral th { background-color: #fff7ed !important; color: #7c2d12; border-bottom: 2px solid #ea580c; }

        /* 4. Modern Slate */
        .theme-slate h2 { color: #0d9488; }
        .theme-slate .divider { height: 2px; background: #0f172a; margin: 15px 0; }
        .theme-slate th { background-color: #f1f5f9 !important; color: #0f172a; border-bottom: 2px solid #0d9488; }
    </style>
</head>
<body>

    <!-- CONTROLS FOR SAVE / SHARE WITH COLORFUL OPTIONS -->
    <div class="controls-bar">
        <div>
            <label for="colorTheme"><strong>Select Bill Style:</strong></label>
            <select id="colorTheme" onchange="applyTheme(this.value)">
                <option value="theme-emerald">1. Emerald Professional (Green)</option>
                <option value="theme-indigo">2. Royal Indigo (Blue)</option>
                <option value="theme-coral">3. Sunset Coral (Warm)</option>
                <option value="theme-slate">4. Modern Slate (Dark/Teal)</option>
            </select>
        </div>
        <div>
            <button onclick="saveOrShareBill()" style="background: #10b981; color: white; font-weight: bold;">Save / Share Bill</button>
        </div>
    </div>

    <!-- PURANA BILL CONTAINER (Logic untouched) -->
    <div class="invoice-box theme-emerald" id="billContainer">
        <table class="header-table">
            <tr>
                <td>
                    <h1 style="margin:0; font-size: 20px;">Golden Star Furniture &amp; Interior</h1>
                    <p style="margin: 5px 0 0 0; font-size: 12px; color: #666;">Furniture Design, Interior Services &amp; Joinery</p>
                </td>
                <td class="text-right">
                    <h2>TAX INVOICE</h2>
                    <span style="font-size: 12px; color: #666;">Date: 18 Sep 2026</span>
                </td>
            </tr>
        </table>

        <div class="divider"></div>

        <table class="items-table">
            <thead>
                <tr>
                    <th>Item Description</th>
                    <th class="text-right">Qty</th>
                    <th class="text-right">Rate (₹)</th>
                    <th class="text-right">Amount (₹)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Custom Mango Wood Center Table</td>
                    <td class="text-right">1</td>
                    <td class="text-right">24,500.00</td>
                    <td class="text-right">24,500.00</td>
                </tr>
                <tr>
                    <td>Handcrafted Wooden Bookshelf</td>
                    <td class="text-right">2</td>
                    <td class="text-right">18,200.00</td>
                    <td class="text-right">36,400.00</td>
                </tr>
            </tbody>
        </table>

        <div style="margin-top: 20px; text-align: right;">
            <strong>Grand Total: ₹60,900.00</strong>
        </div>
    </div>

    <script>
        // Purane code ko change kiye bina sirf theme switch karne ka function
        function applyTheme(themeClass) {
            const container = document.getElementById('billContainer');
            // Purani sabhi theme classes hata kar nayi wali lagayein
            container.className = "invoice-box " + themeClass;
        }

        function saveOrShareBill() {
            // Yahan aapka purana save ya share PDF/Print karne ka code as-is execute hoga
            alert("Bill is ready to be saved/shared with your selected color style!");
            // window.print(); // Aapka purana print/save trigger yahan aa sakta hai
        }
    </script>

</body>
</html>
