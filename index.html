<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST Invoice App</title>
    <!-- Include html2pdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-container {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .share-btn {
            background-color: #28a745;
        }
        .share-btn:hover {
            background-color: #218838;
        }
        /* Printable Invoice Area Styling */
        #printableInvoiceArea {
            background: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            margin-top: 20px;
        }
        h2 {
            text-align: center;
            color: #444;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GST Invoice Generator</h2>
    
    <div class="form-group">
        <label for="invNumber">Invoice Number:</label>
        <input type="text" id="invNumber" value="GS/2026-27/001">
    </div>
    
    <div class="form-group">
        <label for="customerName">Customer Name:</label>
        <input type="text" id="customerName" value="Rahul Sharma">
    </div>

    <!-- Buttons -->
    <div class="btn-container">
        <button onclick="downloadInvoicePDF()">Download PDF</button>
        <button class="share-btn" onclick="sharePDFDirectly()">Share PDF via WhatsApp</button>
    </div>

    <!-- Preview Area -->
    <div id="printableInvoiceArea">
        <h2>TAX INVOICE</h2>
        <p><strong>Invoice No:</strong> <span id="displayInvNo">GS/2026-27/001</span></p>
        <p><strong>Customer:</strong> <span id="displayCustomer">Rahul Sharma</span></p>
        
        <table>
            <thead>
                <tr>
                    <th>Item Description</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Designer Wooden Bed</td>
                    <td>1</td>
                    <td>₹15,000</td>
                    <td>₹15,000</td>
                </tr>
                <tr>
                    <td>Office Computer Table</td>
                    <td>2</td>
                    <td>₹4,500</td>
                    <td>₹9,000</td>
                </tr>
            </tbody>
        </table>
        <h3 style="text-align: right; margin-top: 20px;">Grand Total: ₹24,000</h3>
    </div>
</div>

<script>
    // Live update preview text when inputs change
    document.getElementById('invNumber').addEventListener('input', function() {
        document.getElementById('displayInvNo').innerText = this.value;
    });
    document.getElementById('customerName').addEventListener('input', function() {
        document.getElementById('displayCustomer').innerText = this.value;
    });

    function downloadInvoicePDF() {
        let element = document.getElementById('printableInvoiceArea');
        let invNo = document.getElementById('invNumber').value.replace(/\//g, '_');
        
        let opt = {
            margin:       5,
            filename:     `Invoice_${invNo}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { 
                scale: 2, 
                useCORS: true, 
                scrollY: 0,
                windowWidth: element.scrollWidth,
                windowHeight: element.scrollHeight
            },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        
        html2pdf().from(element).set(opt).save();
    }

    async function sharePDFDirectly() {
        let element = document.getElementById('printableInvoiceArea');
        let invNo = document.getElementById('invNumber').value.replace(/\//g, '_');
        
        let opt = {
            margin:       5,
            filename:     `Invoice_${invNo}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { 
                scale: 2, 
                useCORS: true, 
                scrollY: 0,
                windowWidth: element.scrollWidth,
                windowHeight: element.scrollHeight
            },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        if (navigator.share) {
            try {
                let worker = html2pdf().from(element).set(opt);
                let pdfBlob = await worker.outputPdf('blob');
                let file = new File([pdfBlob], `Invoice_${invNo}.pdf`, { type: 'application/pdf' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: `Tax Invoice ${invNo}`,
                        text: 'Here is your tax invoice PDF.',
                        files: [file]
                    });
                } else {
                    alert("Direct file sharing is not supported on this browser/device. Downloading PDF instead.");
                    worker.save();
                }
            } catch (error) {
                console.log("Sharing error or cancelled:", error);
            }
        } else {
            alert("Direct sharing is not supported on this browser. Use 'Download PDF' instead.");
            downloadInvoicePDF();
        }
    }
</script>

</body>
</html>
